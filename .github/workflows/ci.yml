name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jetify-com/devbox-install-action@v0.15.0
        with:
          enable-cache: true
      - name: Allow ping sockets for the live loopback tests
        run: sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
      - run: devbox run check
